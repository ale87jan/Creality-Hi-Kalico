# Creality Hi (F018, CR4NU200360C20) - closed-loop X/Y drivers
#
# The RS-485 bus, the X/Y drivers (motor_control_hi) and the toolhead pin
# remap that carries the X endstop (io_remap). Included by phase2.cfg and
# phase3.cfg. Pins and values come from the stock V1.1.0.60 config.
#
# SAFETY
# - startup_writes: none keeps the motor drivers read-only: addresses are
#   assigned (as stock does on every start) and then only read commands are
#   sent. Homing needs "stall"; "params" (SYS_PARAM writes) needs the
#   owner's explicit approval. Flash and calibration frames are never sent.
# - No x_*/y_* parameter keys here: with "params" each key that differs
#   from the driver would be written to it.

[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

# nozzle_mcu PB0 (X endstop sensor on the toolhead) is mirrored on PA15, the
# line the main MCU reads on PC7 (stepper_x endstop_pin). The line is shared
# with the probe, so the remap is on only while X homes, as in stock.
[io_remap]
homing_stepper: stepper_x
src_pin: PB0
remap_pin: PA15
src_pullup: 1
remap_def: 1
filterNum: 1
periodTicks: 0

[motor_control_hi]
motor_axes: x, y
motor_x_stall: PA8
motor_y_stall: PA6
startup_writes: none

# Stock homing values for Y (phase 1 leaves them at 0).
[stepper_y]
homing_retract_dist: 10
second_homing_speed: 10
