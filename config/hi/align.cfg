# Creality Hi (F018, CR4NU200360C20) - Kalico Z alignment test config
#
# The phase 2 config (X/Y homing only) plus the dual-Z alignment module, to
# test ZDOWN, UP_SAFE_Z and CHECK_ZLIMIT BEFORE the probe is used (decision
# D12). There is no probe here: G28 Z stays blocked as in phase 2.
# See Creality-Hi-CFW docs/phase4-plan.md for the on-printer test sequence.
# Nothing here has run on a printer yet.
#
# SAFETY
# - ZDOWN and UP_SAFE_Z are moves generated by the MCU. The host cannot
#   stop them: on a timeout it switches the motors off. Keep a hand on the
#   power switch for the first runs.
# - After ZDOWN, Z is set to position_max with the gantry at the top.

[include phase2.cfg]
[include zalign.cfg]

# PB15/PB14 are the phase 1 Z endstop placeholders and also the switches
# z_align_hi watches.
[duplicate_pin_override]
pins: PA11, PB15, PB14
