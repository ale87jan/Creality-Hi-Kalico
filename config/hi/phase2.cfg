# Creality Hi (F018, CR4NU200360C20) - Kalico phase 2 config
#
# Adds to the phase 1 config (printer.cfg): the RS-485 bus, the closed-loop
# X/Y drivers (motor_control_hi), the toolhead pin remap that carries the X
# endstop (io_remap) and X/Y homing.
# NOT in scope: Z homing and the pressure probe (phase 3), CFS, cutter.
#
# Pins and values come from the stock V1.1.0.60 config of the printer.
# See Creality-Hi-CFW docs/phase2-plan.md for the analysis and for the
# on-printer test sequence. Nothing here has run on a printer yet.
#
# SAFETY
# - See motors.cfg for the motor driver write levels (startup_writes).
# - Only G28 X and G28 Y are enabled. Z still needs
#   SET_KINEMATIC_POSITION Z=<z> SET_HOMED=z, as in phase 1.

[include printer.cfg]
[include motors.cfg]

# Replaces the phase 1 override: X and Y can be homed, Z cannot.
[homing_override]
gcode:
  {% if 'Z' in params or ('X' not in params and 'Y' not in params) %}
    {action_raise_error("Only G28 X and G28 Y are enabled in the phase 2 config")}
  {% endif %}
  _HI_HOME_XY {% if 'X' in params %}X=1{% endif %} {% if 'Y' in params %}Y=1{% endif %}
