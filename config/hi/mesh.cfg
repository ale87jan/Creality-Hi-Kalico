# Creality Hi (F018, CR4NU200360C20) - bed mesh per bed temperature
#
# Port of the user's custom_mesh.cfg (author: Alejandro Lara,
# v1.1.0.60-cfw.1): one mesh profile per bed temperature ("60.0c"), probed
# only when it does not exist yet.
#
# Differences from his macros:
# - relative_reference_index (40, the centre) is zero_reference_position in
#   Kalico.
# - move_check_distance is 3, the minimum Kalico accepts (stock has 1).
# - IF_XY_NEED_HOME is a check of the homed axes.
# - After the soak the gantry is re-aligned with G28 Z ALIGN=1 (he switched
#   ZDOWN on and off around G28 Z; phase4.cfg now aligns only when Z is not
#   homed or it is forced).
# - SET_ADJUSTMENTS_FLAG (Creality) is dropped: assumed to keep the z_tilt
#   correction for the next ZDOWN, which phase4.cfg no longer repeats.
# - CXSAVE_CONFIG (Creality) is SAVE_CONFIG RESTART=0.
# - printer.custom_macro.g28_ext_temp (140) is the probe_temp variable.
# - PRINT_PREPARED is not called: START_PRINT is not ported yet.
# - The acceleration lowered for the probing is restored afterwards (his
#   macro left it at a quarter).
# Needs phase4.cfg (probe, homing, z_tilt, cleaning) and heat.cfg.
# Nothing here has run on a printer with Kalico yet.

[bed_mesh]
speed: 20
horizontal_move_z: 3
mesh_min: 10, 10
mesh_max: 250, 250
probe_count: 9, 9
fade_start: 5.0
fade_end: 10.0
split_delta_z: 0.01
move_check_distance: 3
algorithm: bicubic
zero_reference_position: 130, 130

[gcode_macro _HI_MESH]
description: Bed mesh settings of the Hi
# Nozzle temperature for probing (stock [custom_macro] g28_ext_temp)
variable_probe_temp: 140
gcode:

[gcode_macro G29]
description: Custom routine to calibrate bed mesh
gcode:
  SAVE_GCODE_STATE NAME=G29_state
  {% set EXTRUDER_WAITTEMP = printer['gcode_macro _HI_MESH'].probe_temp|float %}
  {% set BED_TEMP = params.BED_TEMP|string|replace("=","")|default(55.0)|float %}
  {% set SOAK_TIME = params.SOAK_TIME|string|replace("=","")|default(5)|int %}
  {% set PROFILE_NAME = BED_TEMP|string + 'c' %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set accel = printer.toolhead.max_accel %}

  RESPOND MSG="[G29] Starting bed mesh calibration for profile: {PROFILE_NAME}"

  M140 S{BED_TEMP-10} # Preheat bed to slightly below target temperature to reduce thermal expansion during initial setup
  M104 S{EXTRUDER_WAITTEMP}

  {% if 'x' not in homed or 'y' not in homed %}
    G28 X Y
  {% endif %}
  G28 Z

  BED_MESH_CLEAR
  NOZZLE_WIPE # Clean nozzle before bed mesh calibration to ensure accurate measurements
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

  M190 S{BED_TEMP}
  M109 S{EXTRUDER_WAITTEMP}

  RESPOND MSG="[G29] Soaking for {SOAK_TIME} minutes..."
  {% if SOAK_TIME > 0 %}
    G4 P{60000 * SOAK_TIME} # X minute heat soak
  {% endif %}

  G28 Z ALIGN=1
  BED_MESH_CLEAR
  Z_TILT_ADJUST # Perform Z tilt adjustment to get new stepper motor adjustments

  G28 Z # Rehome Z after tilt adjust to get accurate Z height for bed mesh calibration

  RESPOND MSG="[G29] Creating bed mesh profile: {PROFILE_NAME}..."
  RESPOND MSG="[G29] Please wait, this may take a few minutes..."
  SET_VELOCITY_LIMIT ACCEL={(accel|int) / 4}
  BED_MESH_CALIBRATE PROFILE={PROFILE_NAME}
  SET_VELOCITY_LIMIT ACCEL={accel}

  G1 X130 Y130 Z10 F12000

  RESTORE_GCODE_STATE NAME=G29_state

  SAVE_CONFIG RESTART=0

[gcode_macro _MESH_IF_NEEDED]
description: Load or create bed mesh based on bed temperature
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(55.0)|float %}
  {% set PROFILE_NAME = BED_TEMP|string + 'c' %}
  {% set SOAK_TIME = params.SOAK_TIME|default(5)|int %}

  RESPOND MSG="[MESH_IF_NEEDED] Looking for {PROFILE_NAME} ..."

  {% if PROFILE_NAME in printer.bed_mesh.profiles %}
    RESPOND MSG="[MESH_IF_NEEDED] {PROFILE_NAME} exists ..."
  {% else %}
    RESPOND MSG="[MESH_IF_NEEDED] {PROFILE_NAME} does not exist, creating ..."
    G29 BED_TEMP={BED_TEMP} SOAK_TIME={SOAK_TIME}
  {% endif %}

  BED_MESH_PROFILE LOAD={PROFILE_NAME}
