# Creality Hi (F018, CR4NU200360C20) - nozzle cleaning macros
#
# G-code only port of the user's NOZZLE_WIPE / NOZZLE_QUICK_WIPE macros
# (themselves based on Creality's NOZ_CLEAR). The values that the originals
# read from [nozzle_clear], [box] and PRINTER_PARAM are macro variables of
# _HI_CLEAN here, taken from the printer's own V1.1.0.60 config.
#
# Geometry (rear strip, behind the bed): the touches start at start_x,
# the metal plate is 20 mm left of the PTFE pad (pad_x), the pad is wiped
# with a wipe_dx x wipe_dy rectangle, and the nozzle ends pressed on the
# metal plate while it cools to seal_temp so it does not ooze.
#
# Needs a config with the probe and full homing (phase4.cfg). The macros
# call G28 Z themselves, so they must NOT be hooked into the Z homing
# (leave register_as_probe unset in [prtouch]: the fork homing code then
# does not call NOZZLE_CLEAN before the probe touch).
# See Creality-Hi-CFW docs/phase4-plan.md. Nothing here has run on a
# printer yet.

[gcode_macro _HI_CLEAN]
description: Nozzle cleaning settings and state of the Hi
# [nozzle_clear] of the printer
variable_start_temp: 175
variable_wipe_temp: 170
variable_seal_temp: 120
variable_start_x: 98
variable_start_y: 268
variable_pad_x: 148
variable_pad_y: 268
variable_pad_dx: 0
variable_pad_dy: 0
variable_wipe_dx: 14
variable_wipe_dy: 2
variable_wipe_cnt: 10
variable_wipe_speed: 6000
variable_wipe_enable: True
variable_upraise: 0.2
variable_touch_speed: 15
variable_touch_cnt: 4
variable_touch_retract: 2
variable_pumpback: 3
# Fine cleaning: purge over the waste bin first (off in the printer config)
variable_fine_enable: False
variable_fine_length: 50
# [box] extrude_pos_x: purge position over the waste bin (left)
variable_purge_x: -18.5
# Where the nozzle waits afterwards (PRINTER_PARAM max position / 2)
variable_wait_x: 130
variable_wait_y: 130
# State
variable_busy: 0
variable_is_clean: 0
gcode:

[gcode_macro NOZZLE_CLEAN]
description: Full nozzle wipe the first time, quick wipe afterwards
gcode:
  {% if printer['gcode_macro _HI_CLEAN'].is_clean|int == 0 %}
    NOZZLE_WIPE
  {% else %}
    NOZZLE_QUICK_WIPE
  {% endif %}

[gcode_macro NOZZLE_WIPE]
description: Full nozzle cleaning: touches, PTFE wipe and sealing
gcode:
  {% set c = printer['gcode_macro _HI_CLEAN'] %}
  {% if c.busy|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_HI_CLEAN VARIABLE=busy VALUE=1
    SAVE_GCODE_STATE NAME=HiCleanState
    RESPOND MSG="NOZZLE_WIPE: starting nozzle cleaning"
    {% set diff_pos_x = range(3)|random %}
    {% set diff_pos_y = range(3)|random %}
    {% set hotend_target = printer.extruder.target %}

    M104 S{c.start_temp|float}
    G28 Z

    {% if c.fine_enable %}
      # Fine cleaning: purge over the waste bin and shake the blob off
      G0 X{c.purge_x|float} F18000
      M109 S{c.start_temp|float}
      G91
      G0 E{c.fine_length|float} F400
      G0 E-1
      G90
      M400
      M106 S255
      G4 P1000
      M400
      G0 X10 F18000
      G0 X{c.purge_x|float}
      G0 X10
    {% endif %}

    G0 X{c.start_x - diff_pos_y} Y{c.start_y + diff_pos_x} F18000
    M109 S{c.start_temp|float}
    G91
    G0 E-{c.pumpback|float}
    G0 X2 F6000

    {% for cnt in range(c.touch_cnt|int) %}
      {% for cnt2 in range(3) %}
        G90
        PROBE PROBE_SPEED={c.touch_speed|int} SAMPLE_RETRACT_DIST={c.touch_retract|float}
        {% if cnt2 == 2 %}
          G91
          G0 X2 F6000
        {% endif %}
        G91
        G0 Z3 X2 F3000
      {% endfor %}
      G91
      G0 X3 F6000
    {% endfor %}

    G90
    PROBE SAMPLES=1 PROBE_SPEED={c.touch_speed|int} SAMPLE_RETRACT_DIST={c.touch_retract|float}

    # Coarse cleaning
    G90
    M106 S255
    M109 S{c.wipe_temp|float}
    M104 S0
    M107
    G0 Z3 F300

    # Metal plate, 20 mm left of the PTFE pad: Z reference for the wipe
    G0 X{c.pad_x - 20} Y{c.pad_y} F{c.wipe_speed|int}
    PROBE SAMPLES=1 PROBE_SPEED={c.touch_speed|int} SAMPLE_RETRACT_DIST={c.touch_retract|float}
    SET_KINEMATIC_POSITION Z=0

    {% if c.wipe_enable %}
      G0 X{c.pad_x} Y{c.pad_y} F{c.wipe_speed|int}
      G91
      G0 X{c.pad_dx} Y{c.pad_dy} F{c.wipe_speed|int}
      G0 Z{c.upraise|float} F300
      G90
      G0 F{c.wipe_speed|int}
      G91
      {% for i in range(c.wipe_cnt|int) %}
        G0 X{c.wipe_dx|int}
        G0 Y{c.wipe_dy|int}
        G0 X-{c.wipe_dx|int}
        G0 Y-{c.wipe_dy|int}
      {% endfor %}
    {% endif %}

    G0 Z5 F300

    # Back to the metal plate: seal the nozzle while it cools down
    G90
    G0 X{c.pad_x - 20} Y{c.pad_y} F{c.wipe_speed|int}
    PROBE SAMPLES=1 PROBE_SPEED={c.touch_speed|int} SAMPLE_RETRACT_DIST={c.touch_retract|float}
    SET_KINEMATIC_POSITION Z=0
    M106 S255
    M109 S{c.seal_temp|float}
    M107

    G0 Z10 F300
    G0 X{c.wait_x} Y{c.wait_y} F6000
    M104 S{hotend_target}

    SET_GCODE_VARIABLE MACRO=_HI_CLEAN VARIABLE=is_clean VALUE=1
    RESTORE_GCODE_STATE NAME=HiCleanState
    SET_GCODE_VARIABLE MACRO=_HI_CLEAN VARIABLE=busy VALUE=0
  {% endif %}

[gcode_macro NOZZLE_QUICK_WIPE]
description: Quick nozzle cleaning: touch on the metal plate and PTFE wipe
gcode:
  {% set c = printer['gcode_macro _HI_CLEAN'] %}
  {% if c.busy|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_HI_CLEAN VARIABLE=busy VALUE=1
    SAVE_GCODE_STATE NAME=HiCleanState
    RESPOND MSG="NOZZLE_QUICK_WIPE: starting quick nozzle cleaning"
    {% set hotend_target = printer.extruder.target %}

    M104 S{c.wipe_temp|float}
    G28 Z

    G0 X{c.pad_x - 20} Y{c.pad_y} F{c.wipe_speed|int}
    M109 S{c.wipe_temp|float}
    G91
    G0 E-{c.pumpback|float}

    G90
    PROBE SAMPLES={c.touch_cnt|int} PROBE_SPEED={c.touch_speed|int} SAMPLE_RETRACT_DIST={c.touch_retract|float}
    SET_KINEMATIC_POSITION Z=0

    G91
    G0 Z{c.upraise|float} F300
    G90
    G0 X{c.pad_x} Y{c.pad_y} F{c.wipe_speed|int}

    G91
    {% for i in range(c.wipe_cnt|int) %}
      G0 X{c.wipe_dx|int}
      G0 Y{c.wipe_dy|int}
      G0 X-{c.wipe_dx|int}
      G0 Y-{c.wipe_dy|int}
    {% endfor %}

    G0 Z5 F300

    G90
    G0 X{c.pad_x - 20} Y{c.pad_y} F{c.wipe_speed|int}
    PROBE
    SET_KINEMATIC_POSITION Z=0

    M104 S{hotend_target}
    G0 Z10 F300
    G0 X{c.wait_x} Y{c.wait_y} F6000

    SET_GCODE_VARIABLE MACRO=_HI_CLEAN VARIABLE=is_clean VALUE=1
    RESTORE_GCODE_STATE NAME=HiCleanState
    SET_GCODE_VARIABLE MACRO=_HI_CLEAN VARIABLE=busy VALUE=0
  {% endif %}
