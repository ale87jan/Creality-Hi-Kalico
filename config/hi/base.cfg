resistance9: 125374.4
temperature10: 25
resistance10: 100000.0
temperature11: 29.333
resistance11: 80262.3
temperature12: 33.667
resistance12: 64809.3
temperature13: 38
resistance13: 52635.2
temperature14: 42.615
resistance14: 42986.6
temperature15: 47.231
resistance15: 35295.4
temperature16: 50
resistance16: 31436.1
temperature17: 51.875
resistance17: 29130.1
temperature18: 56.562
resistance18: 24161.5
temperature19: 61.25
resistance19: 20136.5
