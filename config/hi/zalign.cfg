# Creality Hi (F018, CR4NU200360C20) - dual-Z alignment
#
# The Hi is a bed slinger: Z moves the X gantry on two lead screws and the
# two optical switches are at the top. ZDOWN (stock name) RAISES the gantry
# to the switches and levels the two screws against them; the move is run
# by the main MCU. Values are the stock V1.1.0.60 [z_align] section.
# See Creality-Hi-CFW docs/phase4-plan.md. Included by align.cfg and
# phase4.cfg.
[z_align_hi]
quick_speed: 20
slow_speed: 5
rising_dist: 5
safe_rising_dist: 15
filter_cnt: 10
timeout: 30
retries: 7
retry_tolerance: 10
endstop_pin_z: PB15
endstop_pin_z1: PB14
zd_up: 0
zes_untrig: 0
