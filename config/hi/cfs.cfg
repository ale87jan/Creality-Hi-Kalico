# Creality Hi (F018, CR4NU200360C20) - CFS (Creality Filament System)
#
# creality_cfs is the open module of gitstonelabs/creality-cfs-klipper
# (GPL-3.0), ported so that it talks through the shared [serial_485] bus of
# motors.cfg instead of opening /dev/ttyS5 itself. Include this file after a
# config that has motors.cfg (phase5.cfg does).
# See Creality-Hi-CFW docs/phase5-plan.md. Nothing here has run on a
# printer yet.
#
# SAFETY
# - auto_init is off: nothing is sent to the CFS at start-up. CFS_INIT
#   assigns bus addresses and arms the pre-load; run it by hand, after the
#   read-only checks of the plan.
# - CFS_EXTRUDE, CFS_RETRUDE, CFS_CUT and CFS_FLUSH move filament, heat the
#   nozzle and (CFS_CUT) ram the cutter lever at the right end of X.

# Toolhead filament switch (stock pin). It gates the load and the unload.
# Runout handling during a print is not configured yet.
[filament_switch_sensor filament_sensor]
switch_pin: !nozzle_mcu:PB15
pause_on_runout: False

[creality_cfs]
serial: serial_485 serial485
box_count: 1
auto_init: False
timeout: 0.1
retry_count: 3
filament_sensor: filament_sensor
# Stock [box] Tn_extrude_temp
extrude_temp: 220
# Cutter (stock [box] values): lever switch and positions, cut towards +X
cut_switch_pin: !nozzle_mcu:PB1
pre_cut_pos_x: 240
pre_cut_pos_y: 130
cut_pos_x: 283.5
cut_pos_x_max: 285
# Module example value; stock [box] uses cut_velocity 15000
cut_velocity: 3000
# Stock [box] buffer_empty_len, Tn_extrude and Tn_extrude_velocity
buffer_empty_len: 30
flush_default_len: 140
flush_velocity: 360
# Run after each purge cycle of CFS_FLUSH: knock the purged blob off
nozzle_clean_macro: _HI_CFS_SHAKE

# Purge over the waste bin, left of the bed. CFS_FLUSH extrudes wherever the
# nozzle is, so CFS_PURGE goes to the bin first. Positions are the stock
# [box] values (extrude_pos_x/y, clean_left/right_pos_x, clean_velocity).
# The order of the short pass is an assumption until it is seen on the
# printer. On the way to the bin the bed first goes to detour_y (stock
# detour_pos_y, detour_y: True) so that X crosses clear of the print, after
# a Z lift of z_lift mm. The lift value is ours: the stock config has no Z
# lift for the change (detour_z is commented out there). CFS_PURGE leaves
# the nozzle over the bin, z_lift higher: coming back is up to the caller.
[gcode_macro _HI_CFS]
description: CFS purge settings of the Hi
variable_purge_x: -18.5
variable_purge_y: 130
variable_detour_y: 261
variable_z_lift: 3
variable_shake_x1: 0
variable_shake_x2: -5
variable_shake_speed: 12000
variable_travel_speed: 12000
gcode:

[gcode_macro _HI_CFS_SHAKE]
description: Short pass next to the waste bin to drop the purged filament
gcode:
  {% set c = printer['gcode_macro _HI_CFS'] %}
  SAVE_GCODE_STATE NAME=HiCfsShake
  G90
  G0 X{c.shake_x1} F{c.shake_speed|int}
  G0 X{c.shake_x2}
  G0 X{c.shake_x1}
  G0 X{c.purge_x} F{c.travel_speed|int}
  RESTORE_GCODE_STATE NAME=HiCfsShake

[gcode_macro CFS_PURGE]
description: Go to the waste bin and run CFS_FLUSH there (same parameters)
gcode:
  {% set c = printer['gcode_macro _HI_CFS'] %}
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    {action_raise_error("CFS_PURGE: home X and Y first")}
  {% endif %}
  SAVE_GCODE_STATE NAME=HiCfsPurge
  G90
  {% if 'z' in printer.toolhead.homed_axes and c.z_lift|float > 0 %}
    {% set z = [printer.toolhead.position.z + c.z_lift|float, printer.toolhead.axis_maximum.z]|min %}
    G0 Z{z} F600
  {% endif %}
  G0 Y{c.detour_y} F{c.travel_speed|int}
  G0 X{c.purge_x}
  G0 Y{c.purge_y}
  CFS_FLUSH {rawparams}
  RESTORE_GCODE_STATE NAME=HiCfsPurge
