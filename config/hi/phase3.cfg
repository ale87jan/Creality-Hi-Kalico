# Creality Hi (F018, CR4NU200360C20) - Kalico phase 3 config
#
# base.cfg and motors.cfg (closed-loop X/Y, as in phase 2) plus the nozzle
# pressure probe (prtouch, the open K2 module, unchanged) and Z homing.
# NOT in scope: dual-Z alignment on the bottom sensors (z_align, phase 4),
# nozzle cleaning (phase 4), bed mesh, CFS.
#
# Values come from the [prtouch_v3] section of the printer's own V1.1.0.60
# config. See Creality-Hi-CFW docs/phase3-plan.md for the analysis and for
# the on-printer test sequence. Nothing here has run on a printer yet.
#
# SAFETY
# - This is the first config in which the bed can drive into the nozzle.
#   Follow the plan order: probe armed and tapped by hand far from the bed
#   before any G28 Z.
# - There is no dual-Z alignment and no nozzle cleaning before the probe
#   touch: NOZZLE_CLEAN is an empty placeholder.
# - [motor_control_hi] startup_writes stays as set in motors.cfg; X/Y
#   homing (and so G28 Z) needs "stall".

[include base.cfg]
[include motors.cfg]

# PC7 is both the X endstop input and the probe trigger line (step_swap_pin).
[duplicate_pin_override]
pins: PA11, PC7

# Both Z motors stop on the probe. The bottom photoelectric sensors
# (PB15/PB14) belong to z_align and are not used here.
[stepper_z]
endstop_pin: probe:z_virtual_endstop

[stepper_z1]
endstop_pin: probe:z_virtual_endstop

[prtouch]
z_offset: 0
speed: 5
samples: 3
samples_result: average
samples_tolerance_retries: 10
samples_tolerance: 0.5
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
# Bed centre of the Hi (the module default is the K2 centre).
home_xy: 130, 130

# The fork homing code calls NOZZLE_CLEAN before the probe touches the bed.
# The real cleaning routine comes in phase 4.
[gcode_macro NOZZLE_CLEAN]
description: Placeholder, does nothing (phase 3)
gcode:
