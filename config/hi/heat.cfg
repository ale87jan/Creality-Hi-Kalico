# Creality Hi (F018, CR4NU200360C20) - smart bed heating
#
# The user's M140/M190 overrides (author: Alejandro Lara, v1.1.0.60-cfw.1):
# the bed is first asked for boost degrees more than the target and the real
# target is set lookahead degrees before reaching it. Copied from his
# config_macros.cfg with two changes: the boost ceiling is the max_temp
# variable here (it was PRINTER_PARAM max_bed_temp) and the one message
# uses RESPOND instead of his RESPONSE_INFO macro.
# Nothing here has run on a printer with Kalico yet.

[gcode_macro _SMART_BED_VARS]
description: Variables for smart bed heating
variable_target_temp: 0.0     # Target bed temperature
variable_stage: 0             # 0: Inactive, 1: Boost Active
variable_boost: 10            # Degrees for boost phase
variable_lookahead_low: 5.0   # Degrees before target to start braking (at low temps)
variable_lookahead_high: 3.0  # Degrees before target to start braking (at high temps)
variable_max_temp: 100        # Ceiling of the boost target (PRINTER_PARAM max_bed_temp)
gcode:

[gcode_macro M140]
description: OVERRIDE M140: Asynchronous (Non-blocking) smart bed heating
rename_existing: M140.1
gcode:
  {% set BED_TEMP = params.S|default(55.0)|float %}
  {% set BOOST = printer["gcode_macro _SMART_BED_VARS"].boost|default(10.0)|float %} # Extra degrees for boost phase

  # Stop any previous monitor to avoid conflicts
  UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=0

  {% if BED_TEMP > 0 %}
    # STAGE 1: Apply Boost. Trick the PID by requesting higher temperature
    # RESPONSE_INFO PREFIX="[Smart M140]" MSG="Heating to {BED_TEMP}C (Boost: {boost_temp}C)"
    {% set max_temp = printer['gcode_macro _SMART_BED_VARS'].max_temp %}
    {% set boost_temp = [BED_TEMP + BOOST, max_temp]|min %}

    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={boost_temp}

    # Save the REAL target in the variable
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE={BED_TEMP}
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=1

    # Start the monitor
    UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=1
  {% else %}
    # Turn off bed heater
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=0
  {% endif %}

[delayed_gcode _SMART_BED_MONITOR]
# Description: Monitor for smart bed heating (Only for M140)
gcode:
  {% set VARS = printer["gcode_macro _SMART_BED_VARS"] %}
  {% set CURRENT = printer.heater_bed.temperature %}
  {% set LOOKAHEAD = VARS.lookahead_low|default(3.0)|float if VARS.target_temp|float <= 70.0 else VARS.lookahead_high|default(5.0)|float %}

  {% if VARS.stage == 1 %}
    # Check if we have reached the braking zone
    {% if CURRENT >= (VARS.target_temp - LOOKAHEAD) %}
      # STAGE 2: Braking. Set the REAL temperature
      # RESPONSE_INFO PREFIX="[Smart M140]" MSG="Braking zone reached. Adjusting to {VARS.target_temp}C"
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={VARS.target_temp}
      SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=0
      UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=0
    {% else %}
      # Continue monitoring every second
      UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=1
    {% endif %}
  {% endif %}

[gcode_macro M190]
description: OVERRIDE M190: Blocking smart bed heating (ideal for START_PRINT macros)
rename_existing: M190.1
gcode:
  {% set BED_TEMP = params.S|default(55.0)|float %}
  {% set VARS = printer["gcode_macro _SMART_BED_VARS"] %}
  {% set BOOST = VARS.boost|default(10.0)|float %}
  {% set LOOKAHEAD = VARS.lookahead_low|default(3.0)|float if BED_TEMP <= 70.0 else VARS.lookahead_high|default(5.0)|float %}

  # 1. Kill any previous background process (Previous M140)
  UPDATE_DELAYED_GCODE ID=_SMART_BED_MONITOR DURATION=0

  {% if BED_TEMP > 0 %}
    # RESPONSE_INFO PREFIX="[Smart M190]" MSG="Starting heating sequence to {BED_TEMP}C..."
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE={BED_TEMP}
    # 2. Boost
    {% set max_temp = printer['gcode_macro _SMART_BED_VARS'].max_temp %}
    {% set boost_temp = [BED_TEMP + BOOST, max_temp]|min %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={boost_temp}

    # 3. Blocking wait until braking zone
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - LOOKAHEAD}

    # 4. Braking: Set the REAL target temperature
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    # RESPONSE_INFO PREFIX="[Smart M190]" MSG="Braking thermal inertia..."

    # 5. Final strict stabilization wait: wait until the real target is reached before continuing
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 0.5} MAXIMUM={BED_TEMP + 2.0}
    RESPOND MSG="[Smart M190] Temperature stabilized at {BED_TEMP}C."

  {% else %}
    # Turn off bed heater
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_SMART_BED_VARS VARIABLE=stage VALUE=0
  {% endif %}
