# Creality Hi (F018, CR4NU200360C20) - print start and end macros
#
# Port of the user's macros (author: Alejandro Lara, v1.1.0.60-cfw.1):
# START_PRINT, END_PRINT, the purge line and the assisted cool-down, copied
# from his print_macros.cfg, config_macros.cfg, miscellaneous.cfg and
# printer_params.cfg. Only the Creality-only commands change:
# - BOX_START_PRINT, BOX_END_PRINT, ENABLE_PRESSURE_ADVANCE and
#   NEXT_HOMEZ_NACCU are left out until what they do in stock is read.
# - custom_macro g28_ext_temp is _HI_MESH probe_temp (mesh.cfg).
# - IF_XY_NEED_HOME is a check of the homed axes.
# - The nozzle state is _HI_CLEAN is_clean (clean.cfg).
# - ZDOWN_SWITCH around G28 Z is G28 Z ALIGN=1 (phase4.cfg).
# - BOX_GO_TO_EXTRUDE_POS is _HI_CFS_GO_BIN (cfs.cfg).
# - FORCE_MOVE_E E=-4 is a real 4 mm retraction at the stock 5 mm/s (the
#   stock command retracts and pushes the filament back at once).
# - BOX_END (30 minutes after the print) is _HI_CFS_PRINT_END: it unloads
#   the loaded filament with CFS_RETRUDE, which reheats the nozzle, and
#   then turns the heaters off. Assumed equivalent, not verified.
# - The prepare flag (PRINT_PREPARED, PRINT_PREPARE_CLEAR) is gone:
#   START_PRINT prepares unless all axes are homed and the nozzle is
#   clean. Releasing the motors invalidates the preparation by itself.
# PAUSE, RESUME and CANCEL_PRINT are not ported yet.
# Nothing here has run on a printer with Kalico yet.

[gcode_macro RESPONSE_INFO]
description: Custom RESPONSE_INFO macro for compatibility with Creality existing scripts
gcode:
  {% set prefix = params.PREFIX | default("CREALITY?") %}
  {% set msg = params.MSG|default("response info") %}
  {action_respond_info(prefix + " " + msg)}

[gcode_macro PRINTER_PARAM]
description: Printer parameters
# Printer limits and default values
variable_max_nozzle_temp: 300
variable_max_bed_temp: 100
variable_max_x_position: 260.0
variable_max_y_position: 260.0
variable_max_z_position: 300.0

# Printing status variables for other macros (e.g., pause/resume)
variable_hotend_temp: 0
variable_bed_temp: 0
variable_z_safe_pause: 0.0
variable_fan_speed: 0

# Variables to delete (may be used in other opaqued macros like filament_rack, box, etc.)
variable_auto_g29: 0
variable_print_calibration: 0
variable_g28_extruder_temp: 140
variable_fan_min: 51
variable_default_bed_temp: 60
variable_default_extruder_temp: 220
variable_default_acc: 12000
gcode:

[gcode_macro WAIT_TEMP_START]
description: Start assisted hotend cooling routine
gcode:
  # RESPONSE_INFO PREFIX="[WAIT_TEMP_START]" MSG="Starting assisted hotend cooling routine. Please wait..."
  UPDATE_DELAYED_GCODE ID=WAIT_TEMP DURATION=1
  M106 S255

[delayed_gcode WAIT_TEMP]
# Description: Routine to wait for hotend to cooldown with part fan assistance
initial_duration: 0
gcode:
  {% set cur_temp = printer.extruder.temperature %}
  {% if cur_temp|int > 50 %}
    UPDATE_DELAYED_GCODE ID=WAIT_TEMP DURATION=5
  {% else %}
    WAIT_TEMP_END
  {% endif %}

[gcode_macro WAIT_TEMP_END]
description: Stop assisted hotend cooling routine
gcode:
  # RESPONSE_INFO PREFIX="[WAIT_TEMP_END]" MSG="Hotend cooled down!"
  UPDATE_DELAYED_GCODE ID=WAIT_TEMP DURATION=0
  M107

[gcode_macro _START_PRINT_VARS]
description: Variables for START_PRINT macro
# Z offset variables for different materials
variable_offset_PLA: 0        # Z offset for PLA material
variable_offset_PETG: 0       # Z offset for PETG material
variable_offset_ABS: 0        # Z offset for ABS material
variable_offset_DEFAULT: 0    # Default offset if material is not recognized
variable_offset_PROBE: 1      # If set to 1, do not adjust Z offset based on material
variable_heat_soak: 5         # Time to wait for heat soak before printing (minutes)
variable_purge_adaptative: 1  # Type of purge line to print at the start of the print (0-5)
gcode:
  {action_respond_info("Listing START_PRINT_VARS...")}
  {% for var, value in printer["gcode_macro _START_PRINT_VARS"].items() %}
    {action_respond_info(var ~ ": " ~ value)}
  {% endfor %}

[gcode_macro _PURGE_LINE]
description: Adaptive purge with different patterns and positions to optimize filament flow and reduce waste
# More information https://www.printables.com/model/1035759-adaptive-purge-for-any-3d-printer-using-slicer-var/files
# 0: Full purge line at the front of the bed
# 1: Automatic purge line based on the first layer dimensions with different positions and orientations
# 2: Triangle purge line at the lower left of the first layer
gcode:
  # Get coordinates for the purge line based on the first layer dimensions
  {% set x0 = params.PRINT_AREA.split(",")[0]|default(-1)|float %}
  {% set y0 = params.PRINT_AREA.split(",")[1]|default(-1)|float %}
  {% set x1 = params.PRINT_AREA.split(",")[2]|default(-1)|float %}
  {% set y1 = params.PRINT_AREA.split(",")[3]|default(-1)|float %}
  {% set x_max = printer['gcode_macro PRINTER_PARAM'].max_x_position|float %}
  {% set y_max = printer['gcode_macro PRINTER_PARAM'].max_y_position|float %}
  {% set purge_selected = printer['gcode_macro _START_PRINT_VARS'].purge_adaptative %}

  # RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="ADAPTATIVE PURGE LINE: Recieved coordinates X0={x0} Y0={y0} X1={x1} Y1={y1}"
  M204 S2000
  G1 Z3 F600
  M83         # Relative extrusion mode
  G92 E0      # Reset extruder

  # If purge_selected is 0 or any of the coordinates are missing or invalid, do a full purge line at the front
  {% if purge_selected == 0 or [x0, y0, x1, y1]|min == -1 %}
    RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Full purge line at the front of the bed"
    G1 X0 Y0 F12000         # Move to front left corner of the bed
    G1 Z0.2 F600
    G1 X260 Y0 E30 F6000    # Extrude a purge line across the front of the bed
    G1 Y-0.2 F6000
    G1 X10 Y-0.2 E30 F6000  # Extrude a small purge line back to the front left corner
    G92 E0                  # Reset extruder
    G1 E-0.5 F2100          # Small retraction
    G1 X0 F6000             # Move an additional 10mm without extruding
  {% elif purge_selected == 1 %}
    {% if x0 - 10 > 0 %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Vertical Lower Left"
      G1 X{x0 - 10} Y{y0} Z0.8 F6000      # Position 10mm left of print
      G1 X{x0 - 10} Y{y0 + 30} E30 F360   # Extrude 30mm of filament in the Y direction
      G92 E0
      G1 E-0.5 F2100        # Small retraction
      G1 Y{y0 + 40} F6000   # Move an additional 10mm without extruding
    {% elif y0 - 10 > 0 %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Horizontal Lower Left"
      G1 X{x0} Y{y0 - 10} Z0.8 F6000      # Position 10mm front of print
      G1 X{x0 + 30} Y{y0 - 10} E30 F360   # Extrude 30mm of filament in the x direction
      G92 E0                # Reset extruder
      G1 E-0.5 F2100        # Small retraction
      G1 X{x0 + 40} F6000   # Move an additional 10mm without extruding
    {% elif x1 + 10 < x_max %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Vertical Upper Right"
      G1 X{x1 + 10} Y{y0} Z0.8 F6000      # Position 10mm right of print
      G1 X{x1 + 10} Y{y0 + 30} E30 F360   # Extrude 30mm of filament in the y direction
      G92 E0 # Reset extruder
      G1 E-0.5 F2100 # Small retraction
      G1 Y{y0 + 40} F6000 # Move an additional 10mm without extruding
    {% elif y1 + 10 < y_max %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Horizontal Upper Right"
      G1 X{x0} Y{y1 + 10} Z0.8 F6000 # Position 10mm back of print
      G1 X{x0 + 30} Y{y1 + 10} E30 F360 # Extrude 30mm of filament in the x direction
      G92 E0 # Reset extruder
      G1 E-0.5 F2100 # Small retraction
      G1 X{x0 + 40} F6000 # Move an additional 10mm without extruding
    {% else %}
      RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Not enough space around the print to do a quick wipe, skipping purge line."
    {% endif %}
  {% elif purge_selected == 2 %}
    RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Adaptative Purge Line - Triangle Lower Left"
    G92 E0
    G1 X{x0 - 10} Y{y0} Z0.8 F6000    # Position 10mm left from the lower left of the first layer
    G1 X{x0 - 10} Y{y0 + 30} E30 F360   # Extrude 30mm of filament in the y direction
    G92 E0
    G1 X{x0 - 30} Y{y0 + 15} E30 F360   # Extrude 30mm of filament in both the x and y direction
    G92 E0
    G1 X{x0 - 10} Y{y0} E30 F360      # Extrude 30mm of filament returning back to the start
    G92 E0
    G1 E-0.5 F2100                    # Small retraction
    G1 X{x0 - 10} Y{y0 - 10} F6000      # Move an additional 10mm without extruding
  {% else %}
    RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="Invalid purge_adaptative value: {purge_selected}. No purge line will be printed."
  {% endif %}

  G92 E0    # Reset extruder
  G1 Z3 F600
  # RESPONSE_INFO PREFIX="[PURGE_LINE]" MSG="PURGE_LINE: Finished adaptative purge line..."

[gcode_macro START_PRINT]
description: Prepare and start a print with specified temperatures
# Example usage: START_PRINT EXTRUDER_TEMP=220 BED_TEMP=60
variable_nozzle_is_clean: 0
gcode:
  RESPONSE_INFO PREFIX="[START_PRINT]" MSG="{rawparams}"

  # Cancel any pending delayed box end commands to prevent them from executing during the start of a new print
  CANCEL_DELAYED_BOX_END
  WAIT_TEMP_END           # Ensure any previous cooldown processes are finished before starting a new print

  BOX_ERROR_CLEAR
  # BOX_START_PRINT (Creality) not ported: what it does is not known yet
  G90               # Use absolute positioning

  BED_MESH_CLEAR

  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set EXTRUDER_WAITTEMP = (printer['gcode_macro _HI_MESH'].probe_temp|float)|int %}
  # {% set MATERIAL = params.MATERIAL|default("")|string %}

  # Start bed heating to slightly below target to avoid overshoot with the _SMART_BED_MONITOR
  # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Setting bed to {BED_TEMP - 10}°C..."
  # M140 S{BED_TEMP - 10}

  # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Setting nozzle to {EXTRUDER_WAITTEMP}°C..."
  M104 S{EXTRUDER_WAITTEMP}

  # Disabled Z offset adjustment based on material
  # {% if printer['gcode_macro _START_PRINT_VARS'].offset_probe == 1 %}
  #   RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Not adjusting Z offset relying on probe..."
  # {% else %}
  #   {% if MATERIAL == 'PLA' %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_pla %}
  #   {% elif MATERIAL == 'PETG' %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_petg %}
  #   {% elif MATERIAL == 'ABS' %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_abs  %}
  #   {% else %}
  #     {% set OFFSET = printer['gcode_macro _START_PRINT_VARS'].offset_default %}
  #   {% endif %}

  #   RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Setting Z offset for {MATERIAL} of {OFFSET} ..."
  #   SET_GCODE_OFFSET Z={OFFSET}
  # {% endif %}

  # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Waiting for bed to reach {BED_TEMP}°C..."
  M190 S{BED_TEMP}

  _MESH_IF_NEEDED BED_TEMP={BED_TEMP}

  {% set th = printer.toolhead %}
  {% set unhomed = 'x' not in th.homed_axes or 'y' not in th.homed_axes or 'z' not in th.homed_axes %}
  {% if unhomed or printer['gcode_macro _HI_CLEAN'].is_clean|int == 0 %}
    RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Printer not prepared. Do homing and clean the nozzle..."
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
      G28 X Y
    {% endif %}

    # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Clean nozzle before print start"
    {% if printer['gcode_macro _HI_CLEAN'].is_clean|int == 0 %}
      NOZZLE_WIPE # Full nozzle wipe and clean routine
    {% else %}
      NOZZLE_QUICK_WIPE # Quick wipe nozzle
    {% endif %}

    # RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Waiting for nozzle to reach {EXTRUDER_WAITTEMP}°C..."
    M109 S{EXTRUDER_WAITTEMP}

    # Perform photoelectric leveling once after fine wiping the nozzle to obtain the maximum Z-axis height value.
    # Each time the leveling is performed, Z_TILT_ADJUST must be re-performed to obtain new adjustments.
    # Was: ZDOWN on, G28 Z, ZDOWN off, NEXT_HOMEZ_NACCU (Creality, not
    # ported), G28 Z. phase4.cfg aligns only when forced or Z is not homed.
    G28 Z ALIGN=1
    G28 Z

  {% else %}
    RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Printer prepared. Skipping preparation..."
  {% endif %}

  _HI_CFS_GO_BIN # was BOX_GO_TO_EXTRUDE_POS (M1500)
  M190 S{BED_TEMP}      # Ensure bed is at target temp before starting (in case it cooled down)
  M109 S{EXTRUDER_TEMP} # Wait nozzle heating

  M220 S100 # Reset Feedrate
  M221 S100 # Reset Flowrate
  G21       # Set units to millimeters
  G92 E0    # Reset extruder

  RESPONSE_INFO PREFIX="[START_PRINT]" MSG="Starting print now!"

[gcode_macro END_PRINT]
description: End the actual printing process
gcode:
  RESPONSE_INFO PREFIX="[END_PRINT]" MSG="Finishing print..."
  # ENABLE_PRESSURE_ADVANCE VALUE=1 (Creality) not ported

  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z + 50 > 300 %}
    {% set pos_z = 300 %}
  {% else %}
    {% set pos_z = printer.toolhead.position.z|float + 50 %}
  {% endif %}

  G1 Z{pos_z} F3000 # Move Z to a safe height
  FORCE_MOVE STEPPER=extruder DISTANCE=-4 VELOCITY=5 # was FORCE_MOVE_E E=-4; Retract filament to reduce oozing while cooling down

  # Set a delayed gcode to end the box and disable motors after 30 minutes of idle time
  UPDATE_DELAYED_GCODE ID=DELAYED_BOX_END DURATION=1800

  G1 X0 Y260 F3000  # Move bed to front
  TURN_OFF_HEATERS  # Turn off heaters
  WAIT_TEMP_START   # Start assistend hotend cooldown

  # BOX_END_PRINT (Creality) not ported # Ends the print in the CFS, if not already ended by BOX_END

  RESPONSE_INFO PREFIX="[END_PRINT]" MSG="You could retrieve the print from the bed once it has cooled down."

[delayed_gcode DELAYED_BOX_END]
# description: Send BOX_END and BOX_END_PRINT to the CFS and disable motors after idle timeout when print is finished
initial_duration: 0
gcode:
  # RESPONSE_INFO PREFIX="[DELAYED_BOX_END]" MSG="Finished print timeout reached. Retrude filament to CFS and disable motors."
  _HI_CFS_PRINT_END # was BOX_END:     # Purges the filament and retrudes it back to the box, also ends the print in the CFS
  # BOX_END_PRINT # Ends the print in the CFS, if not already ended by BOX_END
  M84           # Disable motors

[gcode_macro CANCEL_DELAYED_BOX_END]
description: Cancel the DELAYED_BOX_END command when a new print starts or when the print is canceled to avoid unintended BOX_END commands
gcode:
  # RESPONSE_INFO PREFIX="[CANCEL_DELAYED_BOX_END]" MSG="Canceling delayed box end."
  UPDATE_DELAYED_GCODE ID=DELAYED_BOX_END DURATION=0

[gcode_macro _HI_CFS_PRINT_END]
description: Unload the filament back into the CFS after a print
gcode:
  {% set tool = printer.creality_cfs.active_tool|int %}
  {% if tool >= 0 %}
    CFS_RETRUDE TOOL={tool}
    TURN_OFF_HEATERS
  {% endif %}
