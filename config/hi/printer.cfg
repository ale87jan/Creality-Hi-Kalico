# Creality Hi (F018, CR4NU200360C20) - Kalico phase 1 bring-up config
#
# Scope: the three MCUs, Z/Z1/E steppers, heaters, thermistors and fans
# (all in base.cfg).
# NOT in scope: closed-loop X/Y motors (motor_control), pressure probe
# (prtouch), CFS (box), RS-485 bus, host MCU (rpi), accelerometers.
#
# See Creality-Hi-CFW docs/phase1-plan.md for what each section was
# checked against and for the test sequence.
#
# SAFETY
# - Homing is disabled: there is no probe and no X/Y driver in this phase.
# - X and Y are declared only because cartesian kinematics needs them.
#   They can never be homed, so Kalico rejects every X/Y move.
# - Z moves need: SET_KINEMATIC_POSITION Z=<z> SET_HOMED=z  (see the plan).

[include base.cfg]

# Block every homing request in phase 1.
[homing_override]
gcode:
  {action_raise_error("Homing is disabled in the phase 1 config")}

# Stock homes Z with the probe; here the endstop pins are the two
# photoelectric sensors of stock [z_align], only so that QUERY_ENDSTOPS
# shows them. position_endstop is a placeholder (never used: homing is
# blocked above).
[stepper_z]
endstop_pin: PB15
position_endstop: 0

[stepper_z1]
endstop_pin: PB14
