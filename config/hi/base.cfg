[heater_bed]
heater_pin: PC8
sensor_type: hi_bed
sensor_pin: PC4
max_power: 1.0
control: pid
pid_kp: 15.0
pid_ki: 0.01
pid_kd: 900.0
min_temp: 0
max_temp: 115

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 5

#####################################################################
# Fans
#####################################################################

# Part cooling fan. Stock uses off_below: 0.2 (fan off under 20% request).
# Kalico replaces it with min_power, which rescales the request into
# min_power..max_power instead: M106 S128 gives 0.35 duty here, 0.25 on stock.
[fan]
pin: !nozzle_mcu:PA11
enable_pin: nozzle_mcu:PB6
cycle_time: 0.00004
hardware_pwm: false
kick_start_time: 0.100
shutdown_speed: 0
min_power: 0.2
max_power: 0.5

# Hotend fan
[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
heater: extruder
fan_speed: 1.0
heater_temp: 50.0

# No auxiliary fan: the Hi has none (user, 2026-11-10). The stock
# [output_pin fan0] on PB2 is a virtual output kept for Creality macros and
# has no fan wired to it.

#####################################################################
# Misc
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[idle_timeout]
timeout: 600

[respond]
