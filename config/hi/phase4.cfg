# Creality Hi (F018, CR4NU200360C20) - Kalico phase 4 config
#
# The phase 3 config (probe, Z homing) plus the dual-Z alignment: G28 does
# what stock does. It raises the gantry a little if Z is unknown, homes
# X/Y, goes to the bed centre, levels the gantry on the top switches
# (ZDOWN) and then homes Z with the probe.
# See Creality-Hi-CFW docs/phase4-plan.md. Nothing here has run on a
# printer yet.
#
# SAFETY
# - Test align.cfg first (decision D12), then phase3.cfg, then this file.
# - ZDOWN_SWITCH ENABLE=0 skips the alignment in the following Z homings.
# - The gantry is aligned only when Z is not homed (first G28 after
#   start-up, an error or M84). A G28 with Z already homed keeps the
#   alignment and the Z_TILT_ADJUST correction; G28 ALIGN=1 forces it.
#   Idea from nachorepara/creality-hi-klipper-tweaks (patch 01).
# - clean.cfg only adds the nozzle cleaning macros (NOZZLE_CLEAN,
#   NOZZLE_WIPE, NOZZLE_QUICK_WIPE): nothing calls them automatically.
# - Stock restored the last Z_TILT_ADJUST correction after ZDOWN; here it
#   is lost on every alignment: run Z_TILT_ADJUST again after one.

[include phase3.cfg]
[include zalign.cfg]
[include clean.cfg]

[gcode_macro _HI_HOME]
description: Homing settings of the Hi
variable_center_x: 130
variable_center_y: 130
gcode:

[homing_override]
gcode:
  {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set want_z = all or 'Z' in params %}
  {% set need_xy = want_z and ('x' not in homed or 'y' not in homed) %}
  {% set cfg = printer['gcode_macro _HI_HOME'] %}
  {% if 'z' not in homed %}
    # Z unknown: lift the nozzle off the bed before any X/Y travel.
    UP_SAFE_Z
  {% endif %}
  {% if all or need_xy %}
    _HI_HOME_XY X=1 Y=1
  {% elif 'X' in params or 'Y' in params %}
    _HI_HOME_XY {% if 'X' in params %}X=1{% endif %} {% if 'Y' in params %}Y=1{% endif %}
  {% endif %}
  {% if want_z %}
    G90
    G0 X{cfg.center_x} Y{cfg.center_y} F6000
    _HI_ALIGN Z_HOMED={1 if 'z' in homed else 0} FORCE={params.ALIGN|default(0)|int}
    G28 Z
  {% endif %}

[gcode_macro _HI_ALIGN]
description: Align the gantry before a Z homing unless Z was already homed
gcode:
  {% if printer['z_align_hi'].zdown_switch_enable %}
    {% if params.Z_HOMED|default(0)|int == 0 or params.FORCE|default(0)|int %}
      ZDOWN
    {% else %}
      RESPOND MSG="G28: Z was homed, gantry alignment kept (G28 ALIGN=1 forces it)"
    {% endif %}
  {% endif %}

# Fine gantry levelling against the bed with the nozzle probe (stock values
# of the printer). Kalico's own z_tilt, unchanged: run Z_TILT_ADJUST after
# G28. It is what restores the tilt correction that ZDOWN loses.
[z_tilt]
z_positions:
  20, 130
  240, 130
points:
  20, 130
  240, 130
speed: 50
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1
