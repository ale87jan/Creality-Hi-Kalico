# Creality Hi (F018, CR4NU200360C20) - Kalico phase 1 bring-up config
#
# Scope: the three MCUs, Z/Z1/E steppers, heaters, thermistors and fans.
# NOT in scope: closed-loop X/Y motors (motor_control), pressure probe
# (prtouch), CFS (box), RS-485 bus, host MCU (rpi), accelerometers.
#
# Pins and values come from the stock V1.1.0.60 config of the printer
# (Creality-Hi-CFW: data/captures/2026-11-09_hi-v1.1.0.60/printer-config/).
# See Creality-Hi-CFW docs/phase1-plan.md for what each section was
# checked against and for the test sequence.
#
# SAFETY
# - Homing is disabled: there is no probe and no X/Y driver in this phase.
# - X and Y are declared only because cartesian kinematics needs them.
#   They can never be homed, so Kalico rejects every X/Y move.
# - Z moves need: SET_KINEMATIC_POSITION Z=<z> SET_HOMED=z  (see the plan).

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu bed_mcu]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 12000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8.0

# Needed for SET_KINEMATIC_POSITION (Z bring-up without homing).
[force_move]
enable_force_move: True

# Block every homing request in phase 1.
[homing_override]
gcode:
  {action_raise_error("Homing is disabled in the phase 1 config")}

# Several stock pins are shared between sections (enable pin PA11).
[duplicate_pin_override]
pins: PA11

#####################################################################
# Steppers
#####################################################################

# X/Y: closed-loop drivers on RS-485. Declared, never moved (see SAFETY).
[stepper_x]
step_pin: PB10
dir_pin: !PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: !PC7
position_endstop: -19
position_min: -19
position_max: 285
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: -6
position_min: -6
position_max: 274
homing_speed: 30
homing_retract_dist: 0

# Z/Z1: TMC2208 over UART. Stock homes Z with the probe; here the endstop
# pins are the two photoelectric sensors of stock [z_align], only so that
# QUERY_ENDSTOPS shows them. position_endstop is a placeholder (never used:
# homing is blocked above).
[stepper_z]
step_pin: PB4
dir_pin: PA5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
endstop_pin: PB15
position_endstop: 0
position_max: 310
position_min: -5
homing_speed: 5

[stepper_z1]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
endstop_pin: PB14

[tmc2208 stepper_z]
uart_pin: PC2
interpolate: false
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999

[tmc2208 stepper_z1]
uart_pin: PA4
interpolate: false
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 99999999

#####################################################################
# Extruder and hotend
#####################################################################

[extruder]
max_extrude_cross_section: 80
max_extrude_only_distance: 200.0
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
control: pid
pid_Kp: 26.978
pid_Ki: 2.725
pid_Kd: 66.770
min_temp: 0
max_temp: 320

[tmc2208 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
interpolate: false
run_current: 0.37
sense_resistor: 0.3
stealthchop_threshold: 0

[verify_heater extruder]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 2

#####################################################################
# Bed
#####################################################################

# Stock adds a Creality-only correction table (temp_offset_flag,
# adc_temp_list / actual_temp_list) and power_calibration_* options.
# Kalico has none of them: the reading here is the raw thermistor value.
[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
max_power: 1.0
control: pid
pid_kp: 15.0
pid_ki: 0.01
pid_kd: 900.0
min_temp: 0
max_temp: 115

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 5

#####################################################################
# Fans
#####################################################################

# Part cooling fan. Stock uses off_below: 0.2 (fan off under 20% request).
# Kalico replaces it with min_power, which rescales the request into
# min_power..max_power instead: M106 S128 gives 0.35 duty here, 0.25 on stock.
[fan]
pin: !nozzle_mcu:PA11
enable_pin: nozzle_mcu:PB6
cycle_time: 0.00004
hardware_pwm: false
kick_start_time: 0.100
shutdown_speed: 0
min_power: 0.2
max_power: 0.5

# Hotend fan
[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
heater: extruder
fan_speed: 1.0
heater_temp: 50.0

# Auxiliary fan (stock [output_pin fan0], driven by M106 P2 in stock macros)
[fan_generic aux_fan]
pin: PB2
cycle_time: 0.0100
hardware_pwm: false
shutdown_speed: 0

#####################################################################
# Misc
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[idle_timeout]
timeout: 600

[respond]
