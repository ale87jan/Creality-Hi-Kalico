# Creality Hi (F018, CR4NU200360C20) - CFS (Creality Filament System)
#
# creality_cfs is the open module of gitstonelabs/creality-cfs-klipper
# (GPL-3.0), ported so that it talks through the shared [serial_485] bus of
# motors.cfg instead of opening /dev/ttyS5 itself. Include this file after a
# config that has motors.cfg (phase5.cfg does).
# See Creality-Hi-CFW docs/phase5-plan.md. Nothing here has run on a
# printer yet.
#
# SAFETY
# - auto_init is off: nothing is sent to the CFS at start-up. CFS_INIT
#   assigns bus addresses and arms the pre-load; run it by hand, after the
#   read-only checks of the plan.
# - CFS_EXTRUDE, CFS_RETRUDE, CFS_CUT and CFS_FLUSH move filament, heat the
#   nozzle and (CFS_CUT) ram the cutter lever at the right end of X.

# Toolhead filament switch (stock pin). It gates the load and the unload.
# Runout handling during a print is not configured yet.
[filament_switch_sensor filament_sensor]
switch_pin: !nozzle_mcu:PB15
pause_on_runout: False

[creality_cfs]
serial: serial_485 serial485
box_count: 1
auto_init: False
timeout: 0.1
retry_count: 3
filament_sensor: filament_sensor
# Stock [box] Tn_extrude_temp
extrude_temp: 220
# Cutter (stock [box] values): lever switch and positions, cut towards +X
cut_switch_pin: !nozzle_mcu:PB1
pre_cut_pos_x: 240
pre_cut_pos_y: 130
cut_pos_x: 283.5
cut_pos_x_max: 285
# Module example value; stock [box] uses cut_velocity 15000
cut_velocity: 3000
# Stock [box] buffer_empty_len, Tn_extrude and Tn_extrude_velocity
buffer_empty_len: 30
flush_default_len: 140
flush_velocity: 360
# Run after each purge cycle of CFS_FLUSH: knock the purged blob off
nozzle_clean_macro: _HI_CFS_SHAKE

# Purge over the waste bin, left of the bed. CFS_FLUSH extrudes wherever the
# nozzle is, so CFS_PURGE goes to the bin first. Positions are the stock
# [box] values (extrude_pos_x/y, clean_left/right_pos_x, clean_velocity).
# The order of the short pass is an assumption until it is seen on the
# printer. The bed first goes to purge_y (stock detour_pos_y) so that X
# crosses clear of the print, after a Z lift of z_lift mm, and stays there:
# the bin hangs from the gantry, so Y does not matter for the purge (stock
# goes back to extrude_pos_y 130). The lift value is ours: the stock config
# has no Z lift for the change (detour_z is commented out). CFS_PURGE leaves
# the nozzle over the bin, z_lift higher: coming back is up to the caller.
[gcode_macro _HI_CFS]
description: CFS purge settings of the Hi
variable_purge_x: -18.5
variable_purge_y: 261
variable_z_lift: 3
variable_shake_x1: 0
variable_shake_x2: -5
variable_shake_speed: 12000
variable_travel_speed: 12000
gcode:

[gcode_macro _HI_CFS_SHAKE]
description: Short pass next to the waste bin to drop the purged filament
gcode:
  {% set c = printer['gcode_macro _HI_CFS'] %}
  SAVE_GCODE_STATE NAME=HiCfsShake
  G90
  G0 X{c.shake_x1} F{c.shake_speed|int}
  G0 X{c.shake_x2}
  G0 X{c.shake_x1}
  G0 X{c.purge_x} F{c.travel_speed|int}
  RESTORE_GCODE_STATE NAME=HiCfsShake

[gcode_macro _HI_CFS_GO_BIN]
description: Go to the waste bin clear of the print (LIFT=0 skips the Z lift)
gcode:
  {% set c = printer['gcode_macro _HI_CFS'] %}
  {% set th = printer.toolhead %}
  {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
    {action_raise_error("CFS: home X and Y first")}
  {% endif %}
  G90
  {% if params.LIFT|default(1)|int and 'z' in th.homed_axes and c.z_lift|float > 0 %}
    G0 Z{[th.position.z + c.z_lift|float, th.axis_maximum.z]|min} F600
  {% endif %}
  G0 Y{c.purge_y} F{c.travel_speed|int}
  G0 X{c.purge_x}

[gcode_macro CFS_PURGE]
description: Go to the waste bin and run CFS_FLUSH there (same parameters)
gcode:
  SAVE_GCODE_STATE NAME=HiCfsPurge
  _HI_CFS_GO_BIN
  CFS_FLUSH {rawparams}
  RESTORE_GCODE_STATE NAME=HiCfsPurge

# Filament change. Order: Z lift, cut the loaded filament (cutter at +X),
# go to the bin, unload it, load the new one, purge, and come back: X while
# the bed is still at purge_y, then Y, then Z. The loaded tool is the one
# the module tracks; after a restart it does not know it, so pass PREV= to
# say which filament is in the toolhead (PREV=-1: none).
# Not run on a printer yet. The nozzle target is restored without waiting.
[gcode_macro _HI_CFS_CHANGE]
description: Change to the CFS slot TOOL (0-3) [PREV=<loaded tool>]
gcode:
  {% set c = printer['gcode_macro _HI_CFS'] %}
  {% set th = printer.toolhead %}
  {% set target = params.TOOL|int %}
  {% set prev = params.PREV|default(printer.creality_cfs.active_tool)|int %}
  {% if target < 0 or target > 3 %}
    {action_raise_error("CFS: TOOL must be 0 to 3")}
  {% endif %}
  {% if prev == target %}
    RESPOND MSG="CFS: T{target} is already loaded"
  {% else %}
    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes or 'z' not in th.homed_axes %}
      {action_raise_error("CFS: home all axes before a filament change")}
    {% endif %}
    {% set hotend_target = printer.extruder.target %}
    RESPOND MSG="CFS: change T{prev} to T{target}"
    SAVE_GCODE_STATE NAME=HiCfsChange
    G90
    {% if c.z_lift|float > 0 %}
      G0 Z{[th.position.z + c.z_lift|float, th.axis_maximum.z]|min} F600
    {% endif %}
    {% if prev >= 0 %}
      CFS_CUT
    {% endif %}
    _HI_CFS_GO_BIN LIFT=0
    {% if prev >= 0 %}
      CFS_RETRUDE TOOL={prev}
    {% endif %}
    CFS_EXTRUDE TOOL={target}
    CFS_FLUSH
    G90
    G0 X{th.position.x} F{c.travel_speed|int}
    G0 Y{th.position.y}
    M104 S{hotend_target}
    RESTORE_GCODE_STATE NAME=HiCfsChange MOVE=1 MOVE_SPEED=10
  {% endif %}

[gcode_macro T0]
description: Change to CFS slot A
gcode:
  _HI_CFS_CHANGE TOOL=0 {rawparams}

[gcode_macro T1]
description: Change to CFS slot B
gcode:
  _HI_CFS_CHANGE TOOL=1 {rawparams}

[gcode_macro T2]
description: Change to CFS slot C
gcode:
  _HI_CFS_CHANGE TOOL=2 {rawparams}

[gcode_macro T3]
description: Change to CFS slot D
gcode:
  _HI_CFS_CHANGE TOOL=3 {rawparams}
