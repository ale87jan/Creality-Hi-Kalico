# Creality Hi (F018, CR4NU200360C20) - Kalico phase 2 config
#
# Adds to the phase 1 config (printer.cfg): the RS-485 bus, the closed-loop
# X/Y drivers (motor_control_hi), the toolhead pin remap that carries the X
# endstop (io_remap) and X/Y homing.
# NOT in scope: Z homing and the pressure probe (phase 3), CFS, cutter.
#
# Pins and values come from the stock V1.1.0.60 config of the printer.
# See Creality-Hi-CFW docs/phase2-plan.md for the analysis and for the
# on-printer test sequence. Nothing here has run on a printer yet.
#
# SAFETY
# - startup_writes: none keeps the motor drivers read-only: addresses are
#   assigned (as stock does on every start) and then only read commands are
#   sent. Homing needs "stall"; "params" (SYS_PARAM writes) needs the
#   owner's explicit approval. Flash and calibration frames are never sent.
# - No x_*/y_* parameter keys here: with "params" each key that differs
#   from the driver would be written to it.
# - Only G28 X and G28 Y are enabled. Z still needs
#   SET_KINEMATIC_POSITION Z=<z> SET_HOMED=z, as in phase 1.

[include printer.cfg]

[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

# nozzle_mcu PB0 (X endstop sensor on the toolhead) is mirrored on PA15, the
# line the main MCU reads on PC7 (stepper_x endstop_pin). The line is shared
# with the probe, so the remap is on only while X homes, as in stock.
[io_remap]
homing_stepper: stepper_x
src_pin: PB0
remap_pin: PA15
src_pullup: 1
remap_def: 1
filterNum: 1
periodTicks: 0

[motor_control_hi]
motor_axes: x, y
motor_x_stall: PA8
motor_y_stall: PA6
startup_writes: none

# Stock homing values for Y (phase 1 leaves them at 0).
[stepper_y]
homing_retract_dist: 10
second_homing_speed: 10

# Replaces the phase 1 override: X and Y can be homed, Z cannot.
[homing_override]
gcode:
  {% if 'Z' in params or ('X' not in params and 'Y' not in params) %}
    {action_raise_error("Only G28 X and G28 Y are enabled in the phase 2 config")}
  {% endif %}
  G28 {% if 'X' in params %}X{% endif %} {% if 'Y' in params %}Y{% endif %}
