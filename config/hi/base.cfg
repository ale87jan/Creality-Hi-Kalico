# Creality Hi (F018, CR4NU200360C20) - Kalico base config
#
# Shared by every phase config: the three MCUs, the X/Y/Z/Z1/E steppers,
# heaters, thermistors and fans. Not usable on its own: the including file
# sets the Z endstops and the homing policy (printer.cfg, phase2.cfg,
# phase3.cfg).
#
# Pins and values come from the stock V1.1.0.60 config of the printer
# (Creality-Hi-CFW: data/captures/2026-11-09_hi-v1.1.0.60/printer-config/).
# See Creality-Hi-CFW docs/phase1-plan.md for what each section was
# checked against.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu bed_mcu]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 12000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8.0

# Needed for SET_KINEMATIC_POSITION (Z bring-up without homing).
[force_move]
enable_force_move: True

# Several stock pins are shared between sections (enable pin PA11).
[duplicate_pin_override]
pins: PA11

#####################################################################
# Steppers
#####################################################################

# X/Y: closed-loop drivers on RS-485. Declared, never moved (see SAFETY).
[stepper_x]
step_pin: PB10
dir_pin: !PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: !PC7
position_endstop: -19
position_min: -19
position_max: 285
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: -6
position_min: -6
position_max: 274
homing_speed: 30
homing_retract_dist: 0

# Z/Z1: TMC2208 over UART. Endstops are set by the file that includes this
# one (placeholders in printer.cfg, the probe in phase3.cfg).
[stepper_z]
step_pin: PB4
dir_pin: PA5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
position_max: 310
position_min: -5
homing_speed: 5

[stepper_z1]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8

[tmc2208 stepper_z]
uart_pin: PC2
interpolate: false
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999

[tmc2208 stepper_z1]
uart_pin: PA4
interpolate: false
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 99999999

#####################################################################
# Extruder and hotend
#####################################################################

[extruder]
max_extrude_cross_section: 80
max_extrude_only_distance: 200.0
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
control: pid
pid_Kp: 26.978
pid_Ki: 2.725
pid_Kd: 66.770
min_temp: 0
max_temp: 320

[tmc2208 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
interpolate: false
run_current: 0.37
sense_resistor: 0.3
stealthchop_threshold: 0

[verify_heater extruder]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 2

#####################################################################
# Bed
#####################################################################

# Stock corrects the bed thermistor reading with a Creality-only table
# (temp_offset_flag, adc_temp_list: 25, 40, 53, 69, 83, 108 ->
# actual_temp_list: 25, 38, 50, 65, 80, 110; unchanged below 25 C). Kalico
# has no such option, so the same correction is folded into a custom
# sensor: each point is the resistance of the EPCOS 100K B57560G104F
# (4.7k pull-up) at a raw temperature, paired with the corrected one,
# every 5 C. It follows the stock table within 0.25 C (test_hi_config.py).
# The power_calibration_* options of stock are not ported.
[adc_temperature hi_bed]
temperature1: -20
resistance1: 992146.2
temperature2: -15
resistance2: 744776.2
temperature3: -10
resistance3: 564005.0
